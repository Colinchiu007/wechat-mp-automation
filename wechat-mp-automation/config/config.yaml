# 微信公众号自动化 - 主配置文件

app:
  name: "wechat-mp-automation"
  version: "1.0.0"
  env: "development"

# 数据库
database:
  type: "sqlite"
  path: "./data/content.db"

# LLM 配置
llm:
  provider: "openai"
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-4o"
  base_url: "https://api.openai.com/v1"
  timeout: 120
  retry: 3
  max_tokens: 4096

# 存储配置
storage:
  type: "local"
  path: "./output"

# 日志配置
logging:
  level: "INFO"
  file: "./logs/app.log"

# 改写默认配置
rewrite:
  default_strategy: "rewrite"
  default_style: "default"
  min_word_count: 500
  max_word_count: 5000
  target_word_count: 3000

# 格式化配置
format:
  template: "minimal"
  image:
    paths: []
    cover: null

# 公众号账号配置（模块D）
# 需要配置环境变量 WX_APP_ID 和 WX_APP_SECRET
accounts:
  - id: "default"
    name: "默认公众号"
    app_id: "${WX_APP_ID}"
    app_secret: "${WX_APP_SECRET}"
